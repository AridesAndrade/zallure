name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Incluir interfaces SESA no artefato publicado
        run: |
          rm -rf dist/SESA dist/SESA-v2
          cp -R SESA dist/SESA
          if [ -d SESA-v2 ]; then cp -R SESA-v2 dist/SESA-v2; fi


      - name: Mostrar estrutura da pasta dist
        run: |
          echo "===== Conteúdo da pasta dist ====="
          find dist -type f || true
          echo ""
          echo "===== Estrutura completa ====="
          ls -R dist || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
